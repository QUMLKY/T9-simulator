<svg xmlns="http://www.w3.org/2000/svg" width="820" height="448" viewBox="0 0 820 448" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a988f"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4af37"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="448" fill="#191919"/>
  <text x="410" y="20" fill="#e7e4d8" font-size="14.5" font-weight="600" text-anchor="middle">Pure oracle (no training) — the true functions read straight from the simulator</text>

  <!-- Ground truth source -->
  <rect x="210" y="36" width="400" height="54" rx="9" fill="#5c4a10" stroke="#d4af37" stroke-width="1.7"/>
  <text x="410" y="59" fill="#f6e6b0" font-size="14.5" font-weight="700" text-anchor="middle">Simulator ground truth  (BN + latents LU·LA·LC)</text>
  <text x="410" y="79" fill="#e6cf88" font-size="12" text-anchor="middle">true outcome probabilities for every impression</text>

  <line x1="360" y1="90" x2="210" y2="115" stroke="#d4af37" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="460" y1="90" x2="610" y2="115" stroke="#d4af37" stroke-width="1.5" marker-end="url(#arrG)"/>

  <!-- TIER 1 -->
  <rect x="25" y="118" width="370" height="280" rx="14" fill="#3c338f" stroke="#6a60c4"/>
  <text x="210" y="145" fill="#f0eefb" font-size="15.5" font-weight="600" text-anchor="middle">Tier 1 – user value  (ORACLE = true values)</text>

  <rect x="55" y="162" width="310" height="40" rx="8" fill="#55503f" fill-opacity="0.55" stroke="#8b876f"/>
  <text x="210" y="187" fill="#efede4" font-size="12.5" text-anchor="middle">Per-impression TRUE probabilities — read from the sim</text>

  <line x1="150" y1="202" x2="84" y2="226" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="190" y1="202" x2="168" y2="226" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="230" y1="202" x2="252" y2="226" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="270" y1="202" x2="336" y2="226" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>

  <rect x="46" y="228" width="76" height="52" rx="8" fill="none" stroke="#d4af37"/>
  <text x="84" y="250" fill="#f5e2a0" font-size="11" font-weight="700" text-anchor="middle">TRUE</text>
  <text x="84" y="268" fill="#e6cf88" font-size="10.5" text-anchor="middle">P(click)</text>

  <rect x="130" y="228" width="76" height="52" rx="8" fill="none" stroke="#d4af37"/>
  <text x="168" y="250" fill="#f5e2a0" font-size="11" font-weight="700" text-anchor="middle">TRUE</text>
  <text x="168" y="268" fill="#e6cf88" font-size="9" text-anchor="middle">P(install|click)</text>

  <rect x="214" y="228" width="76" height="52" rx="8" fill="none" stroke="#d4af37"/>
  <text x="252" y="250" fill="#f5e2a0" font-size="11" font-weight="700" text-anchor="middle">TRUE</text>
  <text x="252" y="268" fill="#e6cf88" font-size="9" text-anchor="middle">P(payer|install)</text>

  <rect x="298" y="228" width="76" height="52" rx="8" fill="none" stroke="#d4af37"/>
  <text x="336" y="250" fill="#f5e2a0" font-size="11" font-weight="700" text-anchor="middle">TRUE</text>
  <text x="336" y="268" fill="#e6cf88" font-size="9" text-anchor="middle">E(spend|payer)</text>

  <line x1="84" y1="280" x2="150" y2="328" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="168" y1="280" x2="195" y2="328" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="252" y1="280" x2="225" y2="328" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>
  <line x1="336" y1="280" x2="270" y2="328" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr)"/>

  <rect x="50" y="330" width="320" height="52" rx="8" fill="none" stroke="#d4af37" stroke-width="1.4"/>
  <text x="210" y="352" fill="#f6e6b0" font-size="13" font-weight="600" text-anchor="middle">4 ORACLE functions = the simulator's TRUE values</text>
  <text x="210" y="370" fill="#e6cf88" font-size="10" text-anchor="middle">no XGBoost · no fitting · exact</text>

  <!-- TIER 2 -->
  <rect x="425" y="118" width="370" height="280" rx="14" fill="#7e3517" stroke="#bb6a45"/>
  <text x="610" y="145" fill="#fcefe8" font-size="15.5" font-weight="600" text-anchor="middle">Tier 2 – win probability  (ORACLE = true)</text>

  <rect x="460" y="162" width="300" height="44" rx="8" fill="#55503f" fill-opacity="0.55" stroke="#8b876f"/>
  <text x="610" y="189" fill="#efede4" font-size="12.5" text-anchor="middle">Auction mechanism + competing-bid landscape</text>

  <line x1="610" y1="206" x2="610" y2="228" stroke="#9a988f" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="510" y="228" width="200" height="52" rx="8" fill="none" stroke="#d4af37"/>
  <text x="610" y="250" fill="#f5e2a0" font-size="12.5" font-weight="700" text-anchor="middle">TRUE  P(win | bid)</text>
  <text x="610" y="269" fill="#e6cf88" font-size="10" text-anchor="middle">from the auction, per candidate bid</text>

  <line x1="610" y1="280" x2="610" y2="328" stroke="#9a988f" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="485" y="330" width="250" height="52" rx="8" fill="none" stroke="#d4af37" stroke-width="1.4"/>
  <text x="610" y="352" fill="#fcefe8" font-size="13" font-weight="600" text-anchor="middle">ORACLE win function = TRUE P(win|bid)</text>
  <text x="610" y="370" fill="#eec5ad" font-size="10" text-anchor="middle">from the auction · no fitting</text>

  <!-- caption -->
  <text x="410" y="416" fill="#cfc9ee" font-size="10.5" text-anchor="middle">No XGBoost, no training, no estimation error → EV-ranking vs truth = 1.0 (the exact ceiling).</text>
  <text x="410" y="434" fill="#b9b3ea" font-size="10.5" text-anchor="middle">Approach 1 instead trains XGBoost on latent-augmented features (learned → EV-ranking 0.89).</text>
</svg>

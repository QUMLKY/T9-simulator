<svg xmlns="http://www.w3.org/2000/svg" width="820" height="428" viewBox="0 0 820 428" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a988f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="428" fill="#191919"/>

  <!-- Sources -->
  <rect x="35" y="20" width="165" height="52" rx="8" fill="#16467e" stroke="#3f74b3"/>
  <text x="117" y="42" fill="#eaf1fa" font-size="15" font-weight="600" text-anchor="middle">DSP</text>
  <text x="117" y="61" fill="#b9d2ec" font-size="12.5" text-anchor="middle">bid requests, clicks</text>

  <rect x="218" y="20" width="165" height="52" rx="8" fill="#155943" stroke="#3f9678"/>
  <text x="300" y="42" fill="#e9f7f1" font-size="15" font-weight="600" text-anchor="middle">MMP</text>
  <text x="300" y="61" fill="#b6e0cf" font-size="12.5" text-anchor="middle">installs, LTV — C2/C4</text>

  <rect x="438" y="20" width="165" height="52" rx="8" fill="#16467e" stroke="#3f74b3"/>
  <text x="520" y="42" fill="#eaf1fa" font-size="15" font-weight="600" text-anchor="middle">DSP</text>
  <text x="520" y="61" fill="#b9d2ec" font-size="12.5" text-anchor="middle">bid, win/loss, floor</text>

  <rect x="621" y="20" width="165" height="52" rx="8" fill="#7a5a0e" stroke="#b3923f"/>
  <text x="703" y="42" fill="#faf4e6" font-size="15" font-weight="600" text-anchor="middle">SSP</text>
  <text x="703" y="61" fill="#ecd9a8" font-size="12.5" text-anchor="middle">clearing prices — C3/C4</text>

  <line x1="117" y1="72" x2="150" y2="104" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="300" y1="72" x2="270" y2="104" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="520" y1="72" x2="555" y2="104" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="703" y1="72" x2="668" y2="104" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- TIER 1 container -->
  <rect x="25" y="107" width="370" height="296" rx="14" fill="#3c338f" stroke="#6a60c4"/>
  <text x="210" y="136" fill="#f0eefb" font-size="16" font-weight="600" text-anchor="middle">Tier 1 — user value</text>

  <rect x="60" y="156" width="300" height="44" rx="8" fill="#55503f" fill-opacity="0.55" stroke="#8b876f"/>
  <text x="210" y="183" fill="#efede4" font-size="13.5" text-anchor="middle">Raw features: user · app · context</text>

  <line x1="150" y1="200" x2="84" y2="230" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="190" y1="200" x2="168" y2="230" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="230" y1="200" x2="252" y2="230" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="270" y1="200" x2="336" y2="230" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- 4 separate XGBoost model boxes (hurdle: payer split out of LTV) -->
  <rect x="46" y="233" width="76" height="54" rx="8" fill="none" stroke="#b9b3ea"/>
  <text x="84" y="255" fill="#f0eefb" font-size="11" font-weight="600" text-anchor="middle">XGBoost</text>
  <text x="84" y="273" fill="#d9d5f2" font-size="11" text-anchor="middle">P(click)</text>

  <rect x="130" y="233" width="76" height="54" rx="8" fill="none" stroke="#b9b3ea"/>
  <text x="168" y="255" fill="#f0eefb" font-size="11" font-weight="600" text-anchor="middle">XGBoost</text>
  <text x="168" y="273" fill="#d9d5f2" font-size="10" text-anchor="middle">P(install|click)</text>

  <rect x="214" y="233" width="76" height="54" rx="8" fill="none" stroke="#7ed3b0"/>
  <text x="252" y="255" fill="#f0eefb" font-size="11" font-weight="600" text-anchor="middle">XGBoost</text>
  <text x="252" y="273" fill="#bde8d6" font-size="10" text-anchor="middle">P(payer|install)</text>

  <rect x="298" y="233" width="76" height="54" rx="8" fill="none" stroke="#7ed3b0"/>
  <text x="336" y="255" fill="#f0eefb" font-size="11" font-weight="600" text-anchor="middle">XGBoost</text>
  <text x="336" y="273" fill="#bde8d6" font-size="10" text-anchor="middle">E(spend|payer)</text>

  <!-- Lines from model boxes to frozen label -->
  <line x1="84" y1="287" x2="150" y2="320" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="168" y1="287" x2="195" y2="320" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="252" y1="287" x2="225" y2="320" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="336" y1="287" x2="270" y2="320" stroke="#9a988f" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Frozen label -->
  <rect x="50" y="322" width="320" height="54" rx="8" fill="none" stroke="#b9b3ea" stroke-width="1.4"/>
  <text x="210" y="345" fill="#f0eefb" font-size="14" font-weight="600" text-anchor="middle">4 Frozen Tier 1 models (hurdle)</text>
  <text x="210" y="363" fill="#c9c3ee" font-size="10" text-anchor="middle">P(click) · P(install|click) · P(payer|install) · E(spend|payer)</text>

  <!-- TIER 2 container -->
  <rect x="425" y="107" width="370" height="296" rx="14" fill="#7e3517" stroke="#bb6a45"/>
  <text x="610" y="136" fill="#fcefe8" font-size="16" font-weight="600" text-anchor="middle">Tier 2 — win probability</text>

  <rect x="460" y="156" width="300" height="54" rx="8" fill="#55503f" fill-opacity="0.55" stroke="#8b876f"/>
  <text x="610" y="175" fill="#efede4" font-size="13" text-anchor="middle">Raw features + bid + floor</text>
  <text x="610" y="192" fill="#cfccbe" font-size="12" text-anchor="middle">+ clearing price (C3/C4)</text>

  <line x1="610" y1="210" x2="610" y2="240" stroke="#9a988f" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="460" y="242" width="300" height="58" rx="8" fill="none" stroke="#f0b393"/>
  <text x="610" y="264" fill="#fcefe8" font-size="13" font-weight="600" text-anchor="middle">XGBoost AFT (censored regression)</text>
  <text x="610" y="284" fill="#f3cdb6" font-size="11.5" text-anchor="middle">on competing bid → P(win | bid, context)</text>

  <line x1="610" y1="300" x2="610" y2="320" stroke="#9a988f" stroke-width="1.3" marker-end="url(#arr)"/>

  <rect x="485" y="322" width="250" height="54" rx="8" fill="none" stroke="#f0b393" stroke-width="1.4"/>
  <text x="610" y="347" fill="#fcefe8" font-size="14" font-weight="600" text-anchor="middle">Frozen Tier 2 model</text>
  <text x="610" y="365" fill="#eec5ad" font-size="11.5" text-anchor="middle">P(win | bid, context)</text>
</svg>

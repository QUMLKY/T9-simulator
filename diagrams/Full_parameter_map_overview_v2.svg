<text x="784" y="268" text-anchor="middle" font-size="9"   fill="#37474F">&#8592; LU4 &#183; t_pay(D2, D3)</text>
<text x="784" y="302" text-anchor="middle" font-size="15" font-weight="700" fill="#311B92">e_ltv</text>
<text x="784" y="320" text-anchor="middle" font-size="9"   fill="#37474F">&#8592; LU5 &#183; LC2 &#183; &#956;(B2) &#183; &#961;(A3)</text>
<line x1="670" y1="338" x2="898" y2="338" stroke="#AB47BC" stroke-width="0.8" stroke-dasharray="4,3"/>
<text x="784" y="372" text-anchor="middle" font-size="15" font-weight="700" fill="#311B92">ev_truth</text>
<text x="784" y="392" text-anchor="middle" font-size="9"   fill="#37474F">= p_click &#215; p_install &#215; p_payer &#215; e_ltv</text>
<text x="784" y="506" text-anchor="middle" font-size="8.5" fill="#78909C">(never directly observed in any condition)</text>


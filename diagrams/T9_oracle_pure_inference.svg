<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a988f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="840" height="600" fill="#191919"/>
  <text x="420" y="20" fill="#e7e4d8" font-size="14.5" font-weight="600" text-anchor="middle">Pure-oracle inference — the exact ceiling, computed from the simulator's true values</text>

  <!-- Impression + true probs -->
  <rect x="225" y="36" width="390" height="64" rx="9" fill="#16467e" stroke="#3f74b3"/>
  <text x="420" y="60" fill="#eaf1fa" font-size="14.5" font-weight="600" text-anchor="middle">Impression from ground truth</text>
  <text x="420" y="82" fill="#f5e2a0" font-size="12" font-weight="600" text-anchor="middle">+ its TRUE outcome probabilities (read from the sim)</text>

  <line x1="420" y1="100" x2="420" y2="128" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- Read box -->
  <rect x="265" y="130" width="310" height="42" rx="9" fill="#4a4a43" stroke="#7d7d72"/>
  <text x="420" y="156" fill="#efede4" font-size="13" font-weight="600" text-anchor="middle">Read TRUE p(·) &amp; P(win|bid) for this impression</text>

  <line x1="345" y1="172" x2="221" y2="206" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr2)"/>
  <line x1="495" y1="172" x2="625" y2="206" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- TIER 1 -->
  <rect x="30" y="208" width="382" height="186" rx="11" fill="#3c338f" stroke="#6a60c4"/>
  <text x="221" y="232" fill="#f0eefb" font-size="14" font-weight="600" text-anchor="middle">Tier 1 – user value  (ORACLE, true values)</text>

  <line x1="170" y1="244" x2="82" y2="270" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>
  <line x1="200" y1="244" x2="174" y2="270" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>
  <line x1="242" y1="244" x2="266" y2="270" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>
  <line x1="272" y1="244" x2="358" y2="270" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>

  <rect x="42" y="272" width="84" height="34" rx="7" fill="none" stroke="#d4af37"/>
  <text x="84" y="293" fill="#e6cf88" font-size="10" text-anchor="middle">TRUE P(click)</text>

  <rect x="132" y="272" width="84" height="34" rx="7" fill="none" stroke="#d4af37"/>
  <text x="174" y="293" fill="#e6cf88" font-size="8.5" text-anchor="middle">TRUE P(inst|click)</text>

  <rect x="224" y="272" width="84" height="34" rx="7" fill="none" stroke="#d4af37"/>
  <text x="266" y="293" fill="#e6cf88" font-size="8.5" text-anchor="middle">TRUE P(payer|inst)</text>

  <rect x="316" y="272" width="84" height="34" rx="7" fill="none" stroke="#d4af37"/>
  <text x="358" y="293" fill="#e6cf88" font-size="8.5" text-anchor="middle">TRUE E(spend|pay)</text>

  <line x1="84" y1="306" x2="158" y2="336" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>
  <line x1="174" y1="306" x2="200" y2="336" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>
  <line x1="266" y1="306" x2="240" y2="336" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>
  <line x1="358" y1="306" x2="284" y2="336" stroke="#9a988f" stroke-width="1.1" marker-end="url(#arr2)"/>

  <rect x="55" y="338" width="332" height="50" rx="8" fill="none" stroke="#d4af37"/>
  <text x="221" y="359" fill="#f6e6b0" font-size="12" font-weight="600" text-anchor="middle">Expected Value  (product of the TRUE values)</text>
  <text x="221" y="377" fill="#e6cf88" font-size="9.5" text-anchor="middle">EV = P(click)·P(install|click)·P(payer|install)·E(spend|payer)</text>

  <line x1="221" y1="388" x2="300" y2="418" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- TIER 2 -->
  <rect x="440" y="208" width="370" height="186" rx="11" fill="#7e3517" stroke="#bb6a45"/>
  <text x="625" y="232" fill="#fcefe8" font-size="14" font-weight="600" text-anchor="middle">Tier 2 – win probability  (ORACLE, true)</text>

  <line x1="625" y1="244" x2="625" y2="298" stroke="#9a988f" stroke-width="1.3" marker-end="url(#arr2)"/>

  <rect x="485" y="300" width="280" height="52" rx="7" fill="none" stroke="#d4af37"/>
  <text x="625" y="322" fill="#f6e6b0" font-size="13" font-weight="600" text-anchor="middle">TRUE  P(win | bid)</text>
  <text x="625" y="341" fill="#e6cf88" font-size="11" text-anchor="middle">swept across candidate bids</text>

  <line x1="625" y1="352" x2="546" y2="418" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- Profit-max -->
  <rect x="185" y="420" width="470" height="64" rx="11" fill="#4a4a43" stroke="#7d7d72"/>
  <text x="420" y="446" fill="#efede4" font-size="15" font-weight="600" text-anchor="middle">Profit-max optimiser (arithmetic)</text>
  <text x="420" y="470" fill="#dedbd0" font-size="13" text-anchor="middle">Profit(bid) = ( EV − bid ) × P(win | bid)  ·  ROAS filter</text>

  <line x1="420" y1="484" x2="420" y2="510" stroke="#9a988f" stroke-width="1.4" marker-end="url(#arr2)"/>

  <!-- Oracle result (ceiling) -->
  <rect x="235" y="512" width="370" height="58" rx="10" fill="#5c4a10" stroke="#d4af37" stroke-width="1.7"/>
  <text x="420" y="536" fill="#f6e6b0" font-size="14.5" font-weight="700" text-anchor="middle">Oracle bid → ORACLE PROFIT (exact ceiling)</text>
  <text x="420" y="555" fill="#e6cf88" font-size="10.5" text-anchor="middle">EV-ranking vs truth = 1.0  ·  C1–C4 regret = oracle − their profit</text>

  <text x="420" y="590" fill="#b9b3ea" font-size="10.5" text-anchor="middle">No learned models anywhere — every quantity is the simulator's true value. (Approach 1 uses frozen XGBoost trained with latents.)</text>
</svg>
